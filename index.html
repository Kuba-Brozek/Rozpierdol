<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rozpierdol</title>
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
<script>
  try { var t = JSON.parse(localStorage.getItem('postep-theme') || '{}');
    document.documentElement.setAttribute('data-accent', t.accent || 'ocean');
    if (t.mode === 'light' || t.mode === 'dark') document.documentElement.setAttribute('data-mode', t.mode);
  } catch (e) { document.documentElement.setAttribute('data-accent', 'ocean'); }
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rozpierdol">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1179x2556.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" aria-hidden="true">
  <svg class="splash-logo" viewBox="60 140 392 232" width="150" height="89">
    <rect x="150" y="236" width="212" height="40" rx="14" fill="#7d8796"/>
    <rect x="112" y="156" width="56" height="200" rx="20" fill="#fff"/>
    <rect x="344" y="156" width="56" height="200" rx="20" fill="#fff"/>
    <rect x="72" y="196" width="48" height="120" rx="18" fill="#fff"/>
    <rect x="392" y="196" width="48" height="120" rx="18" fill="#fff"/>
  </svg>
  <div class="splash-name">Rozpierdol</div>
  <p class="splash-quote" id="splash-quote">Gdy wiatry nie sprzyjają,<br>to buduje się charakter.</p>
</div>
<script>
  // Losowy tekst na ekranie startowym (zatwierdzona lista); nigdy dwa razy ten sam pod rząd
  (function () {
    var Q = [
      'Gdy wiatry nie sprzyjają,<br>to buduje się charakter.',
      'Nie ma że boli.',
      'Jak nie urok, to sraczka.',
      'Jest moc!',
      'Kto rano wstaje,<br>ten ma cały dzień na trening.',
      'Ogarnij się i działaj.',
      'Nie pękaj, będzie dobrze.',
      'Niech kurwy giną<br>pod ciepłą pierzyną.',
      'Pierdolę, nie robię…<br>dobra, robię.',
      'Nie ma chuja we wsi.',
      'Zapierdalaj, nie gadaj.',
      'Mordo, nie ma lipy.',
      'Ja pierdolę, ale pompa.'
    ];
    var last = -1; try { last = +localStorage.getItem('rozpierdol-cytat'); } catch (e) {}
    var i = Math.floor(Math.random() * Q.length);
    if (i === last) i = (i + 1 + Math.floor(Math.random() * (Q.length - 1))) % Q.length;
    try { localStorage.setItem('rozpierdol-cytat', i); } catch (e) {}
    document.getElementById('splash-quote').innerHTML = Q[i];
  })();
</script>

<!-- górny pasek na każdym ekranie: poziom i XP (stuknij = szczegóły), ikona użytkownika = Ustawienia -->
<header class="topbar" id="topbar">
  <div class="tb-main">
    <!-- nazwa ekranu, na którym jesteś (zamiast dużego nagłówka na samym ekranie) -->
    <div class="tb-row">
      <div class="tb-title" id="tb-title" aria-hidden="true"></div>
      <span class="tb-date" id="tb-date"></span>
    </div>
    <button type="button" class="tb-level" id="tb-level" aria-label="Twój poziom"></button>
  </div>
  <button type="button" class="tb-user" id="tb-user" aria-label="Ustawienia i konto"></button>
</header>

<main id="app">
  <!-- PODSUMOWANIE -->
  <section class="view" id="view-start" aria-labelledby="h-start">
    <header class="vhead">
      <h1 id="h-start">Postęp</h1>
    </header>
    <div id="start-body"></div>
  </section>

  <!-- WAGA (identyfikator „dieta” zostaje dla zgodności) -->
  <section class="view" id="view-dieta" hidden aria-labelledby="h-dieta">
    <header class="vhead">
      <h1 id="h-dieta">Ciało</h1>
    </header>
    <div id="dieta-body"></div>
  </section>

  <section class="view" id="view-cialo" hidden aria-labelledby="h-cialo">
    <button class="link back" type="button" data-go="dieta">‹ Ciało</button>
    <header class="vhead"><h1 id="h-cialo">Pomiary ciała</h1></header>
    <div id="cialo-body"></div>
  </section>

  <section class="view" id="view-miesnie" hidden aria-labelledby="h-miesnie">
    <button class="link back" type="button" data-go="start">‹ Postęp</button>
    <header class="vhead"><h1 id="h-miesnie">Graf trenowanych partii mięśniowych</h1></header>
    <div id="miesnie-body"></div>
  </section>

  <section class="view" id="view-trening" hidden aria-labelledby="h-trening">
    <header class="vhead"><h1 id="h-trening">Trening</h1></header>
    <div id="trening-body"></div>
  </section>

  <!-- PLANY -->
  <!-- KALENDARZ -->
  <section class="view" id="view-kalendarz" hidden aria-labelledby="h-kalendarz">
    <header class="vhead">
      <h1 id="h-kalendarz">Kalendarz</h1>
    </header>
    <div id="kalendarz-body"></div>
  </section>

  <section class="view" id="view-plany" hidden aria-labelledby="h-plany">
    <button class="link back" type="button" data-go="trening">‹ Trening</button>
    <header class="vhead"><h1 id="h-plany">Plany</h1><button class="link" id="plan-new" type="button">+ Nowy plan</button></header>
    <div id="plany-body"></div>
  </section>

  <!-- ĆWICZENIA -->
  <section class="view" id="view-cwiczenia" hidden aria-labelledby="h-cw">
    <button class="link back" type="button" data-go="plany">‹ Plany</button>
    <header class="vhead"><h1 id="h-cw">Ćwiczenia</h1><button class="link" id="btn-custom" type="button">+ Własne</button></header>
    <div id="cw-body"></div>
  </section>

  <!-- WIĘCEJ -->
  <section class="view" id="view-wiecej" hidden aria-labelledby="h-wiecej">
    <button class="link back" type="button" id="wiecej-back" hidden>‹ Wróć</button>
    <header class="vhead"><h1 id="h-wiecej">Ustawienia</h1></header>
    <div id="wiecej-body"></div>
  </section>
</main>

<nav class="tabs" aria-label="Sekcje">
  <button type="button" data-tab="start" aria-current="page">
    <!-- wykres idący w górę ze strzałką -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 4v16h16"/>
      <path d="M7.5 15l3.5-4 3 2.5 4.5-6"/>
      <path d="M15.5 7.5h3v3"/>
    </svg>
    <span>Postęp</span>
  </button>
  <button type="button" data-tab="dieta">
    <!-- sylwetka człowieka: głowa, ramiona, tułów, nogi -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="4.6" r="2"/>
      <path d="M6 9.2l6 1 6-1"/>
      <path d="M12 10.2v5"/>
      <path d="M9.5 21l2.5-5.8 2.5 5.8"/>
    </svg>
    <span>Ciało</span>
  </button>
  <button type="button" data-tab="trening">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg>
    <span>Trening</span>
  </button>
  <button type="button" data-tab="kalendarz">
    <!-- kartka kalendarza z kropkami dni -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="5" width="16" height="15" rx="3"/>
      <path d="M4 10h16"/>
      <path d="M8.5 3v4M15.5 3v4"/>
      <path d="M8.5 14h.01M12 14h.01M15.5 14h.01M8.5 17h.01M12 17h.01"/>
    </svg>
    <span>Kalendarz</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" data-close aria-label="Zamknij">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="extras.js"></script>
<script src="calendar.js"></script>
<script src="policy.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="lock.js"></script>
</body>
</html>
